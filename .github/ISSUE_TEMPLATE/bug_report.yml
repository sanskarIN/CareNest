name: Bug report
description: Report reproducible CareNest behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not attach real health documents, medicine records, backup files, passwords, or other private data."
  - type: input
    id: version
    attributes:
      label: CareNest version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS, Mac Catalyst, Windows]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps using fictional data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
