name: Feature request
description: Suggest an organizational feature
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "CareNest does not provide diagnosis, dosage decisions, treatment advice or emergency services."
  - type: textarea
    id: problem
    attributes:
      label: Organizational problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy or data-sharing impact
