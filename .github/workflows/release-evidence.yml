name: CareNest Release Evidence

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  evidence:
    name: Core release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Prepare evidence directory
        shell: bash
        run: mkdir -p artifacts/test-results artifacts/dependencies artifacts/source artifacts/tooling

      - name: Record source and toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > artifacts/commit-sha.txt
          git status --porcelain=v1 > artifacts/git-status.txt
          git ls-files > artifacts/source/tracked-files.txt
          git ls-files -z | sort -z | xargs -0 sha256sum > artifacts/source/tracked-files-SHA256SUMS
          dotnet --info > artifacts/dotnet-info.txt
          python3 --version > artifacts/python-version.txt 2>&1
          printf '%s\n' "${GITHUB_REF}" > artifacts/github-ref.txt
          printf '%s\n' "${GITHUB_RUN_ID}" > artifacts/github-run-id.txt
          printf '%s\n' "${GITHUB_RUN_ATTEMPT}" > artifacts/github-run-attempt.txt

      - name: Verify package evidence tooling
        id: package_tooling
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            build/scripts/verify-store-safe-payload.py \
            build/scripts/create-package-evidence.py \
            build/scripts/test-create-package-evidence.py
          python3 build/scripts/test-create-package-evidence.py \
            | tee artifacts/tooling/package-evidence-self-test.txt

      - name: Run unit tests with TRX evidence
        id: unit
        continue-on-error: true
        run: >-
          dotnet test tests/CareNest.UnitTests/CareNest.UnitTests.csproj
          --configuration Release
          --logger "trx;LogFileName=unit.trx"
          --results-directory artifacts/test-results
          --nologo

      - name: Run integration tests with TRX evidence
        id: integration
        continue-on-error: true
        run: >-
          dotnet test tests/CareNest.IntegrationTests/CareNest.IntegrationTests.csproj
          --configuration Release
          --logger "trx;LogFileName=integration.trx"
          --results-directory artifacts/test-results
          --nologo

      - name: Run UI contract tests with TRX evidence
        id: ui
        continue-on-error: true
        run: >-
          dotnet test tests/CareNest.UiTests/CareNest.UiTests.csproj
          --configuration Release
          --logger "trx;LogFileName=ui-contract.trx"
          --results-directory artifacts/test-results
          --nologo

      - name: Capture transitive dependency inventories
        id: dependencies
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          dotnet list src/CareNest.Shared/CareNest.Shared.csproj package --include-transitive --format json > artifacts/dependencies/shared.json
          dotnet list src/CareNest.Domain/CareNest.Domain.csproj package --include-transitive --format json > artifacts/dependencies/domain.json
          dotnet list src/CareNest.Application/CareNest.Application.csproj package --include-transitive --format json > artifacts/dependencies/application.json
          dotnet list src/CareNest.Infrastructure/CareNest.Infrastructure.csproj package --include-transitive --format json > artifacts/dependencies/infrastructure.json
          dotnet list tests/CareNest.UnitTests/CareNest.UnitTests.csproj package --include-transitive --format json > artifacts/dependencies/unit-tests.json
          dotnet list tests/CareNest.IntegrationTests/CareNest.IntegrationTests.csproj package --include-transitive --format json > artifacts/dependencies/integration-tests.json
          dotnet list tests/CareNest.UiTests/CareNest.UiTests.csproj package --include-transitive --format json > artifacts/dependencies/ui-tests.json

      - name: Verify tracked workspace remains unchanged
        id: workspace
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1 --untracked-files=no > artifacts/git-status-after.txt
          git diff --exit-code

      - name: Record evidence checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find artifacts -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS

      - name: Upload immutable run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: carenest-release-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Require complete successful release evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          for result in \
            "package_tooling=${{ steps.package_tooling.outcome }}" \
            "unit=${{ steps.unit.outcome }}" \
            "integration=${{ steps.integration.outcome }}" \
            "ui=${{ steps.ui.outcome }}" \
            "dependencies=${{ steps.dependencies.outcome }}" \
            "workspace=${{ steps.workspace.outcome }}"; do
            name="${result%%=*}"
            outcome="${result#*=}"
            if [[ "$outcome" != "success" ]]; then
              echo "Release evidence component failed: $name ($outcome)"
              failures=1
            fi
          done
          exit "$failures"
