name: Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  policy-and-risk-gate:
    name: Policy and risk gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Block unresolved production dependency risks
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eiq '^[[:space:]]*[-*][[:space:]]+\*\*Status:\*\*[[:space:]]*Open([[:space:]]|$)' docs/security/DEPENDENCY_RISK_REGISTER.md; then
            echo 'Production release blocked: dependency risk register contains an open risk.'
            exit 1
          fi
      - name: Require release checklist evidence
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^[[:space:]]*-[[:space:]]+\[[[:space:]]\]' docs/releases/RELEASE_CHECKLIST.md; then
            echo 'Production release blocked: release checklist still contains incomplete items.'
            exit 1
          fi
      - name: Confirm required release documents and tooling
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CHANGELOG.md
            PROJECT_STATUS.md
            what_changed.md
            docs/releases/AUTOMATED_BASELINE.md
            docs/releases/RELEASE_CHECKLIST.md
            docs/releases/NEXT_STEPS.md
            docs/releases/RELEASE_PROCESS.md
            docs/releases/RELEASE_EVIDENCE.md
            docs/releases/SECURITY_RELEASE_REVIEW.md
            docs/releases/MANUAL_TEST_MATRIX.md
            docs/releases/PACKAGED_RELEASE_VALIDATION.md
            docs/releases/STORE_BUILD_POLICY.md
            docs/releases/STORE_SUBMISSION_CHECKLIST.md
            docs/releases/STORE_POLICY_REVIEW_20260818.md
            docs/releases/PACKAGE_EVIDENCE_TOOLING.md
            docs/security/DEPENDENCY_RISK_REGISTER.md
            build/scripts/verify-store-safe-payload.py
            build/scripts/create-package-evidence.py
            build/scripts/test-create-package-evidence.py
            build/scripts/verify-documentation-links.py
            build/scripts/test-verify-documentation-links.py
          )
          for path in "${required[@]}"; do
            if [[ ! -s "$path" ]]; then
              echo "Production release blocked: required release evidence/tooling is missing or empty: $path"
              exit 1
            fi
          done

  release-source-tests:
    name: Release source tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify repository Python tooling syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            build/scripts/verify-store-safe-payload.py \
            build/scripts/create-package-evidence.py \
            build/scripts/test-create-package-evidence.py \
            build/scripts/verify-documentation-links.py \
            build/scripts/test-verify-documentation-links.py
      - name: Self-test package evidence tooling
        run: python3 build/scripts/test-create-package-evidence.py
      - name: Self-test documentation link tooling
        run: python3 build/scripts/test-verify-documentation-links.py
      - name: Verify active documentation local links
        run: python3 build/scripts/verify-documentation-links.py
      - name: Unit tests
        run: dotnet test tests/CareNest.UnitTests/CareNest.UnitTests.csproj --configuration Release --nologo
      - name: Integration tests
        run: dotnet test tests/CareNest.IntegrationTests/CareNest.IntegrationTests.csproj --configuration Release --nologo
      - name: UI contract tests
        run: dotnet test tests/CareNest.UiTests/CareNest.UiTests.csproj --configuration Release --nologo
