name: CareNest source bootstrap

on:
  push:
    branches:
      - build/carenest-bootstrap
    paths:
      - build/bootstrap/trigger.txt

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct validated source archive
        shell: bash
        run: |
          set -euo pipefail
          cat build/bootstrap/source.part.* > /tmp/carenest-source.b64
          base64 -d /tmp/carenest-source.b64 > /tmp/carenest-source.tar.gz
          echo "8fd4364eeaf05edce86c16262a51651808f15e44c90dc715276d88a415f708fd  /tmp/carenest-source.tar.gz" | sha256sum -c -
          mkdir -p /tmp/carenest-source
          tar -xzf /tmp/carenest-source.tar.gz -C /tmp/carenest-source
      - name: Create clean release commit with requested identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B carenest-release origin/main
          cp -a /tmp/carenest-source/. .
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add -A
          git commit -m "feat: build complete CareNest local-first health organizer"
          git push origin HEAD:refs/heads/release/carenest-1.0.0-rc.1 --force
