name: CareNest CI

on:
  workflow_dispatch:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify repository Python tooling syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            build/scripts/verify-store-safe-payload.py \
            build/scripts/create-package-evidence.py \
            build/scripts/test-create-package-evidence.py \
            build/scripts/verify-documentation-links.py \
            build/scripts/test-verify-documentation-links.py \
            build/scripts/verify-cross-platform-targets.py
      - name: Verify configured cross-platform targets
        run: python3 build/scripts/verify-cross-platform-targets.py
      - name: Self-test package evidence tooling
        run: python3 build/scripts/test-create-package-evidence.py
      - name: Self-test documentation link tooling
        run: python3 build/scripts/test-verify-documentation-links.py
      - name: Verify active documentation local links
        run: python3 build/scripts/verify-documentation-links.py
      - name: Verify platform-neutral formatting
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            src/CareNest.Shared/CareNest.Shared.csproj
            src/CareNest.Domain/CareNest.Domain.csproj
            src/CareNest.Application/CareNest.Application.csproj
            src/CareNest.Infrastructure/CareNest.Infrastructure.csproj
            src/CareNest.CrossPlatform/CareNest.CrossPlatform.csproj
            src/CareNest.CrossPlatform.Desktop/CareNest.CrossPlatform.Desktop.csproj
            tests/CareNest.UnitTests/CareNest.UnitTests.csproj
            tests/CareNest.IntegrationTests/CareNest.IntegrationTests.csproj
            tests/CareNest.UiTests/CareNest.UiTests.csproj
          )
          for project in "${projects[@]}"; do
            dotnet format "$project" --verify-no-changes --verbosity minimal
          done
      - name: Restore and test unit tests
        run: dotnet test tests/CareNest.UnitTests/CareNest.UnitTests.csproj --configuration Release --nologo
      - name: Restore and test integration tests
        run: dotnet test tests/CareNest.IntegrationTests/CareNest.IntegrationTests.csproj --configuration Release --nologo
      - name: Run UI contract tests
        run: dotnet test tests/CareNest.UiTests/CareNest.UiTests.csproj --configuration Release --nologo

  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install Android MAUI workload
        run: dotnet workload install maui-android
      - name: Build Android
        run: dotnet build src/CareNest.App/CareNest.App.csproj -f net10.0-android -c Release -p:CareNestTargetFramework=net10.0-android --nologo

  windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install Windows MAUI workload
        run: dotnet workload install maui
      - name: Build Windows
        run: dotnet build src/CareNest.App/CareNest.App.csproj -f net10.0-windows10.0.19041.0 -c Release -p:CareNestTargetFramework=net10.0-windows10.0.19041.0 --nologo

  apple:
    name: Apple build
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install Apple MAUI workloads
        run: dotnet workload install maui-ios maui-maccatalyst
      - name: Build iOS simulator target
        run: dotnet build src/CareNest.App/CareNest.App.csproj -f net10.0-ios -c Release -p:CareNestTargetFramework=net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64 --nologo
      - name: Build Mac Catalyst
        run: dotnet build src/CareNest.App/CareNest.App.csproj -f net10.0-maccatalyst -c Release -p:CareNestTargetFramework=net10.0-maccatalyst --nologo

  linux-desktop:
    name: Linux desktop build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build Avalonia desktop host
        run: dotnet build src/CareNest.CrossPlatform.Desktop/CareNest.CrossPlatform.Desktop.csproj -c Release --nologo

  browser:
    name: WebAssembly browser build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install WebAssembly toolchain
        run: dotnet workload install wasm-tools
      - name: Publish Avalonia browser host
        run: dotnet publish src/CareNest.CrossPlatform.Browser/CareNest.CrossPlatform.Browser.csproj -c Release --nologo
