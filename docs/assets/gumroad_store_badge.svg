<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Shop on Gumroad — Ram Sandesh storefront</title>
  <desc id="desc">CareNest repository promotional badge linking readers to https://ramsandesh.gumroad.com. This repository artwork is not included in CareNest application packages.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171827"/>
      <stop offset="1" stop-color="#25233a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#8d4dff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="28" y="28" width="1144" height="304" rx="52" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="28" y="28" width="1144" height="304" rx="52" fill="none" stroke="url(#accent)" stroke-width="8"/>

  <g transform="translate(78 76)">
    <rect width="208" height="208" rx="46" fill="url(#accent)"/>
    <path d="M47 84h114l-9-26H56z" fill="#fff" opacity="0.96"/>
    <path d="M54 84v77h100V84" fill="#fff" opacity="0.92"/>
    <path d="M76 112h57v49H76z" fill="#221f35"/>
    <circle cx="104" cy="52" r="34" fill="#221f35"/>
    <text x="104" y="66" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="800" fill="#fff">G</text>
  </g>

  <text x="332" y="112" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" fill="#ffffff">SHOP ON GUMROAD</text>
  <text x="332" y="170" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="500" fill="#e8e5f4">Digital products • books • project resources</text>

  <rect x="332" y="205" width="782" height="76" rx="38" fill="#ffffff"/>
  <circle cx="376" cy="243" r="24" fill="#ff4fa3"/>
  <path d="M366 243a10 10 0 0 1 10-10h12m-2 20h-10a10 10 0 0 1-10-10m20-10h10a10 10 0 0 1 0 20h-12" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <text x="420" y="254" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#171827">https://ramsandesh.gumroad.com</text>
</svg>
